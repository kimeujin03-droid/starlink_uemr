[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starlink-pathb"
version = "0.1.0"
description = "Path B Starlink-like UEMR injection experiments for HERA-like EoR-window QA"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "skyfield>=1.46",
  "joblib>=1.3",
  "statsmodels>=0.14",
  "h5py>=3.10",
  "astropy>=6.0",
  "pyuvdata>=3.0",
  "hdf5plugin>=4.0"
]

[tool.setuptools]
packages = ["pathb"]
